<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#211a30">
<link rel="icon" href="data:,">
<title>Palmshade Heat 3D</title>
<style>
:root{color-scheme:dark;--ink:#211a30;--cream:#fff0da;--sand:#ffd491;--coral:#ff8e83;--cyan:#a8e5dc;--panel:#20192eea;--edge:#fff0da4d}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211a30;color:var(--cream);font:14px system-ui,sans-serif}
#view,#hud{position:absolute;inset:0}
#view canvas{display:block}
#hud,#atlas,#minimap{pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:4px;box-shadow:0 8px 24px #17102235}
.brand{position:absolute;top:23px;left:24px;text-shadow:1px 2px 7px #2f1739;color:var(--cream)}
.kicker,.chip,.speed,.controls,.unit,.quiet{font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.08em}
.brand h1{font:900 clamp(25px,4.6vw,65px)/.91 system-ui,sans-serif;margin:4px 0 0;letter-spacing:-.09em}
.brand strong{font:italic 900 clamp(19px,3vw,43px)/1 system-ui,sans-serif;color:var(--coral);letter-spacing:-.06em}
.district{margin-top:7px;text-transform:uppercase;letter-spacing:.17em;color:#fff4dd;font-weight:850}
.mission{position:absolute;left:24px;top:clamp(123px,13vw,175px);padding:10px 13px;max-width:calc(100vw - 295px);border-left:4px solid var(--sand);font-size:13px;font-weight:800}
.dispatch{position:absolute;right:24px;top:24px;width:204px;padding:12px;border-top:3px solid var(--coral)}
.dispatch .kicker{color:var(--coral)}
.rows{margin-top:6px}
.unit{display:grid;grid-template-columns:1fr 1.1fr auto;gap:4px;padding:6px 0;border-top:1px solid #fff3}
.unit span{color:var(--cyan);font-size:10px}
.unit em{font-style:normal;color:#ffd7b4;white-space:nowrap}
.quiet{margin-top:11px;opacity:.68}
.radio{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);display:flex;gap:13px;align-items:center;width:min(400px,43vw);padding:12px;border-left:4px solid var(--cyan)}
.portrait{flex:0 0 40px;height:40px;display:grid;place-items:center;background:#75435e;color:var(--cream);border-radius:50%;font-weight:900}
.radio .kicker{color:var(--cyan);margin-bottom:3px}
.line{line-height:1.35}
.complete{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;padding:22px 38px;min-width:270px;border-top:4px solid var(--cyan)}
.complete .kicker{color:var(--cyan)}
.complete h2{margin:4px 0;font-size:34px;letter-spacing:-.05em}
.reward{margin:7px 0 14px;font-size:27px;font-weight:900;color:var(--sand)}
.status{position:absolute;bottom:48px;left:24px;width:206px;padding:10px 12px}
.status-top,.weapons,.meters{display:flex;align-items:center;gap:7px}
.status-top{justify-content:space-between}
.cash{color:var(--sand);font-size:21px}
.chip{padding:5px 6px;background:#ffffff12;border:1px solid #ffffff21;border-radius:3px;white-space:nowrap}
.weapons{margin:7px 0}
.chip.selected{color:var(--ink);background:var(--cyan)}
.meter{flex:1}
.meter .kicker{font-size:9px}
.track{height:6px;background:#ffffff30;margin:3px 0 5px;overflow:hidden;border-radius:2px}
.track i{display:block;height:100%;background:var(--coral)}
.armour i{background:var(--cyan)}
.speed{color:var(--sand);margin-top:4px}
.heat{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:152px;text-align:center}
.stars{font-size:25px;letter-spacing:2px;text-shadow:0 2px 4px #201829;color:var(--cream)}
.stars.hot{color:var(--sand)}
.bust{padding:5px 10px 1px;margin-top:4px}
.prompt{position:absolute;left:50%;top:66%;transform:translateX(-50%);padding:7px 12px;text-align:center;background:var(--ink);color:var(--sand);border:1px solid var(--sand);font-weight:850;white-space:nowrap}
.controls{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;color:#fff3d8;background:#201929dc;padding:7px 10px;border-radius:3px}
#minimap{position:absolute;right:24px;bottom:24px;width:clamp(124px,17vw,214px);height:auto;background:#21243c;border:2px solid #fff1c9b0;border-radius:50%;box-shadow:0 5px 20px #21112480}
#atlas{position:absolute;inset:0;width:100%;height:100%;z-index:5}
@media(max-width:680px){.brand,.mission,.status{left:10px}.dispatch,#minimap{right:10px}.dispatch{width:150px;font-size:10px}.unit{grid-template-columns:1fr auto}.unit span{grid-column:1}.unit em{grid-row:1;grid-column:2}.mission{max-width:60vw}.status{width:155px}.controls{font-size:8px;max-width:100vw;white-space:normal;width:max-content}.radio{bottom:205px;width:min(400px,86vw)}}
</style>
</head>
<body>
<div id="view"></div>
<div id="hud"></div>
<canvas id="minimap" width="256" height="256" aria-label="Local map"></canvas>
<canvas id="atlas" hidden aria-label="Palmshade district map"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
