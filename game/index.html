<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PALMSHADE HEAT 3D</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0; width: 100%; height: 100%; overflow: hidden;
        background: #16303a; color: #fff2cf; font-family: Arial,Helvetica,sans-serif;
      }
      #game, #game > canvas {
        position: absolute; inset: 0; width: 100%; height: 100%; display: block;
      }
      #hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 2px 4px #0008; }
      .panel {
        position: absolute; background: linear-gradient(135deg,#10262ce8,#1d3035cc);
        border: 1px solid #ffdc8e44; border-radius: 5px; box-shadow: 0 8px 30px #0003;
        padding: 16px 20px; line-height: 1.6; backdrop-filter: blur(8px); white-space: pre-line;
      }
      .brand {
        position: absolute; top: 25px; left: 28px; font-size: 29px; line-height: .92;
        font-weight: 950; letter-spacing: 3px; color: #ffe3a5; transform: skew(-5deg);
      }
      .stats {
        right: 28px; top: 24px; min-width: 215px; text-align: right;
        font-size: 22px; color: #ffda85; font-weight: bold;
      }
      .job {
        top: 28px; left: 50%; transform: translateX(-50%); width: min(610px,49vw);
        font-size: 13px; letter-spacing: 1px; border-top: 3px solid #ffda85;
      }
      .dispatch { right: 28px; top: 185px; width: 260px; font: 12px/1.9 monospace; letter-spacing: .4px; }
      .vitals { left: 306px; bottom: 49px; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
      .prompt {
        left: 50%; bottom: 155px; transform: translateX(-50%);
        color: #ffdf99; font-weight: bold; letter-spacing: 1px;
      }
      .dialogue { left: 28px; top: 120px; width: 330px; font-size: 14px; border-left: 3px solid #ffda85; }
      .completion {
        left: 50%; top: 28%; transform: translateX(-50%); min-width: 360px; text-align: center;
        font-weight: bold; font-size: 21px; border-top: 4px solid #ffda85;
        background: #12292df2; line-height: 1.9;
      }
      .controls { position: absolute; bottom: 17px; left: 306px; font-size: 10px; letter-spacing: 1px; color: #f6dfb4; }
      #minimap {
        position: absolute; left: 28px; bottom: 25px; width: 256px; height: 256px;
        border: 2px solid #ffdc8e88; border-radius: 8px; box-shadow: 0 10px 35px #0006; background: #143c49;
      }
      #map-overlay {
        position: absolute; inset: 4vh 15vw; background: #10252af5; border: 1px solid #ffda8577;
        padding: 20px; box-shadow: 0 20px 90px #0009; text-align: center;
      }
      #map-overlay h1 { font-size: 22px; letter-spacing: 5px; margin: 0 0 10px; }
      #city-map { display: block; max-height: 72vh; max-width: 100%; width: auto; height: auto; margin: auto; }
      #map-status { font: 12px/1.8 monospace; color: #ffda85; white-space: pre-line; }
      #events { position: absolute; inset: 0; pointer-events: none; }
      .event-text { position: absolute; font-size: 25px; font-weight: 900; text-shadow: 0 2px 5px #000; transform: translate(-50%,-100%); }
      [hidden] { display: none!important; }
      #loading {
        position: absolute; inset: 0; display: grid; place-content: center;
        background: #15343a; font-size: 25px; letter-spacing: 5px; z-index: 10;
      }
      @media (max-width:800px) {
        .dispatch { right: 12px; width: 205px; top: 170px; }
        .dialogue { top: 110px; left: 12px; width: 230px; }
        .brand { left: 12px; font-size: 22px; }
        .job { top: 85px; width: 70vw; font-size: 10px; }
        .stats { right: 12px; top: 12px; font-size: 17px; }
        .vitals { left: 190px; bottom: 45px; padding: 8px; font-size: 10px; }
        #minimap { width: 160px; height: 160px; left: 12px; }
        .controls { left: 190px; font-size: 8px; }
        .prompt { bottom: 200px; font-size: 11px; }
        #map-overlay { inset: 5vh 3vw; }
      }
    </style>
  </head>
  <body>
    <main id="game" aria-label="Palmshade open world"></main>
    <div id="hud"><div id="dialogue" hidden></div><div id="completion" hidden></div></div>
    <canvas id="minimap" width="256" height="256" aria-label="Local north-up map"></canvas>
    <div id="events"></div>
    <section id="map-overlay" hidden><h1>PALMSHADE / CITY DIRECTORY</h1><canvas id="city-map"></canvas><p id="map-status"></p></section>
    <div id="loading">PALMSHADE HEAT 3D<br><small style="font-size:12px;letter-spacing:2px;margin-top:18px">WARMING THE ASPHALT…</small></div>
    <script type="module">
      import { loadThree } from './src/three-loader.js';
      try {
        await loadThree();
        const { boot } = await import('./src/main.js');
        await boot();
      } catch (failure) {
        document.getElementById('loading').innerText = 'Unable to start Palmshade: ' + failure.message;
        console.error(failure);
      }
    </script>
  </body>
</html>
